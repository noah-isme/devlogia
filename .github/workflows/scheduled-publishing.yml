name: Scheduled Publishing

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  publish-scheduled:
    name: Publish Due Scheduled Posts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      # Optional: override with custom scheduler URL
      SCHEDULER_TARGET_URL: ${{ secrets.SCHEDULER_TARGET_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run scheduled publishing worker
        run: |
          if [ -n "${SCHEDULER_TARGET_URL}" ]; then
            echo "Calling external scheduler endpoint: ${SCHEDULER_TARGET_URL}"
            curl -sSf -X POST "${SCHEDULER_TARGET_URL}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              -w "\nHTTP %{http_code}\n" || exit 1
          else
            echo "Running local scheduled publishing worker..."
            pnpm posts:publish-scheduled
          fi

      - name: Log completion
        run: echo "Scheduled publishing completed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"